name: ci

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false
      - name: Run linter
        working-directory: ./
        run: |
          test -z $(gofmt -l .)

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false
      - name: Run tests
        working-directory: ./
        run: |
          go test -race ./...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false
      - name: Run code vetter
        working-directory: ./
        run: |
          go vet ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - v1.21.14
          - v1.24.15
          - v1.27.11
          - v1.30.4
          - v1.33.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: false
      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:${{ matrix.k8s }}
          cluster_name: dispatcher-it
      - name: Run integration tests
        working-directory: ./
        run: |
          go test -tags=integration -race -v -timeout=5m ./...
