<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example App</title>
    <style>
      h2 {
        padding: 0;
        margin: 30px 0 5px;
      }

      .output {
        margin-top: 10px;
        height: 200px;
        width: 600px;
        border: 1px solid black;
        font-family: 'Courier New', Courier, monospace;
        overflow: auto;
      }
    </style>
    <script>
      const runUnicastExample = (form) => {
        const nodeName = form['node-name'].value;
        const eventSource = new EventSource(`/unicast-events?node-name=${encodeURIComponent(nodeName)}`);
        const output = document.getElementById('unicast-example-output');

        output.innerHTML = '';

        eventSource.onmessage = function(event) {
          const el = document.createElement('div');
          el.textContent = event.data;
          output.appendChild(el);

          if (event.data === "finished") {
            eventSource.close();
          }
        };

        eventSource.onerror = function(error) {
          console.error('Unicast Example EventSource failed:', error);
        };
      };

      let subscriptionUnicastES;

      const startUnicastSubscribeExample = (form) => {
        const nodeName = form['node-name'].value;
        subscriptionUnicastES = new EventSource(`/unicast-subscribe-events?node-name=${encodeURIComponent(nodeName)}`);
        const output = document.getElementById('unicast-subscribe-output');

        output.innerHTML = '';

        subscriptionUnicastES.onmessage = function(event) {
          const el = document.createElement('div');
          el.textContent = event.data;
          output.appendChild(el);

          if (event.data === "finished") {
            subscriptionUnicastES.close();
          }
        };

        subscriptionUnicastES.onerror = function(error) {
          console.error('Fanout Subscribe Example EventSource failed:', error);
        };
      }

      const stopUnicastSubscribeExample = () => {
        if (subscriptionUnicastES && subscriptionUnicastES.readyState !== EventSource.CLOSED) {
          subscriptionUnicastES.close();
        }
      }

      const runFanoutExample = () => {
        const eventSource = new EventSource('/fanout-events');
        const output = document.getElementById('fanout-example-output');

        output.innerHTML = '';

        eventSource.onmessage = function(event) {
          const el = document.createElement('div');
          el.textContent = event.data;
          output.appendChild(el);

          if (event.data === "finished") {
            eventSource.close();
          }
        };

        eventSource.onerror = function(error) {
          console.error('Fanout Example EventSource failed:', error);
        };
      };

      let subscriptionFanoutES;

      const startFanoutSubscribeExample = () => {
        subscriptionFanoutES = new EventSource('/fanout-subscribe-events');
        const output = document.getElementById('fanout-subscribe-output');

        output.innerHTML = '';

        subscriptionFanoutES.onmessage = function(event) {
          const el = document.createElement('div');
          el.textContent = event.data;
          output.appendChild(el);

          if (event.data === "finished") {
            subscriptionFanoutES.close();
          }
        };

        subscriptionFanoutES.onerror = function(error) {
          console.error('Fanout Subscribe Example EventSource failed:', error);
        };
      }

      const stopFanoutSubscribeExample = () => {
        if (subscriptionFanoutES && subscriptionFanoutES.readyState !== EventSource.CLOSED) {
          subscriptionFanoutES.close();
        }
      }
    </script>
  </head>
  <body>
    <h1>Example App</h1>
    <h2>Unicast Example:</h2>
    <form onsubmit="runUnicastExample(this); return false;">
      <input type="text" name="node-name" placeholder="Node name...">
      <button type="submit">Run</button>
    </form>
    <div id="unicast-example-output" class="output"></div>
    <h2>Unicast Subscribe Example:</h2>
    <form onsubmit="startUnicastSubscribeExample(this); return false;">
      <input type="text" name="node-name" placeholder="Node name...">
      <button type="submit">Start</button>
      <button type="button" onclick="stopUnicastSubscribeExample()">Stop</button>
    </form>
    <div id="unicast-subscribe-output" class="output"></div>
    <h2>Fanout Example:</h2>
    <button type="button" onclick="runFanoutExample()">Run</button>
    <div id="fanout-example-output" class="output"></div>
    <h2>Fanout Subscribe Example:</h2>
    <button type="button" onclick="startFanoutSubscribeExample()">Start</button>
    <button type="button" onclick="stopFanoutSubscribeExample()">Stop</button>
    <div id="fanout-subscribe-output" class="output"></div>
  </body>
</html>
